# Example: run Spillway on every Terraform pull request and show findings in the PR.
# Copy to .github/workflows/ in the repository that holds your Terraform.
#
# Security notes for this workflow:
# - The plan job uses a READ-ONLY plan role (OIDC, pinned to this repo and to pull_request events),
#   never the apply role. Spillway itself needs no AWS credentials and makes no network calls.
# - `pull_request` (not `pull_request_target`) so code from forks never runs with secrets.
name: terraform-exposure-gate
on:
  pull_request:
    paths: ["infra/**"]
permissions:
  contents: read
  id-token: write          # OIDC to AWS for `terraform plan`
  security-events: write   # upload SARIF to code scanning

jobs:
  spillway:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_READONLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform plan -input=false -out=tfplan
      - run: terraform show -json tfplan > plan.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/Seif-Abdelhamid/spillway@<pin-a-commit-sha>"
      - name: Spillway (fails on new high/critical exposure)
        run: spillway plan.json --format sarif -o spillway.sarif --tf-dir . --account-id ${{ vars.AWS_ACCOUNT_ID }}
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: infra/spillway.sarif
          category: spillway
